name: Verify Zlatyn Clip Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check server syntax
        run: node --check server.js
      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text()
          if "<script>" not in html or "</script>" not in html:
              raise SystemExit("Inline JavaScript block was not found in index.html")
          inline = html.split("<script>", 1)[1].split("</script>", 1)[0]
          if not inline.strip():
              raise SystemExit("Inline JavaScript block is empty")
          Path("/tmp/zlatyn-inline.js").write_text(inline)
          PY
          node --check /tmp/zlatyn-inline.js
      - name: Smoke-test real upload, FFmpeg render, and download
        run: node scripts/smoke-test.mjs
